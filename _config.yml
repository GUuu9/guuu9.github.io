# 저장소의 Markdown 문서를 공통 디자인으로 변환합니다. 원본 Markdown은 그대로 보관합니다.
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
optional_front_matter:
  remove_originals: false
# README도 README.html 경로를 유지해 상대 링크와 탐색 경로를 일치시킵니다.
readme_index:
  enabled: false
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: docs
include:
  - README.md
  - 01.Tools/**/README.md
  - 02.Boilerplates/**/README.md
  - 03.Utilities/**/README.md
  - 04.Servers/**/README.md
exclude:
  - issues
source_url: "https://github.com/GUuu9/guuu9.github.io/blob/main/"
document_navigation:
  - title: "개발 환경·작업 가이드"
    path: "README.md"
  - title: "Setup"
