# 저장소의 Markdown 문서를 공통 디자인으로 변환합니다. 원본 Markdown은 그대로 보관합니다.
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
optional_front_matter:
  remove_originals: false
# README도 README.html 경로를 유지해 상대 링크와 탐색 경로를 일치시킵니다.
readme_index:
  enabled: false
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: docs
